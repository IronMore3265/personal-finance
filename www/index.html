<!DOCTYPE html>
<html lang="en" data-dark="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Paisa</title>

  <!-- Manrope is bundled, not fetched: the app has to look right offline. -->
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div id="app">
    <!-- status bar is inserted by the shell so it can sit above the header -->
    <div id="header"></div>
    <!-- Two panes, one box. #scroll is the screen you are on and owns the
         vertical scroll; #peek holds the neighbouring tab while a sideways
         swipe is in flight, so the next screen travels in under the finger
         rather than appearing after it. -->
    <div id="pager">
      <div id="scroll" class="scroll"></div>
      <div id="peek" class="scroll scroll--peek" aria-hidden="true"></div>
    </div>
    <div id="overlay"></div>
    <div id="toast"></div>
    <div id="nav"></div>

    <!-- Held until the database is open, so the first paint is never empty. -->
    <div id="boot" class="boot">
      <div class="boot__mark">Paisa</div>
    </div>

    <!-- The two gates, drawn over everything including the bar and the nav.
         Empty unless one of them is up; see core/lock.js and screens/signin.js. -->
    <div id="gate"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
